<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東澳公路旅行詳盡指南 | BNE ⇄ SYD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Chosen Palette: Coastal Professional (Navy, Emerald, Sand) -->
    <!-- Application Structure Plan: 
         - 左側：動態資訊欄。預設顯示景點列表，點擊後切換為該景點的詳細介紹（包含 Google Maps 連結與建議時間）。
         - 右側：地圖主體。標記帶有數字 1-13 的順序。
         - 技術：Leaflet.js 處理地圖，Vanilla JS 管理 UI 狀態切換。
    -->
    <!-- Visualization & Content Choices:
         - 地圖標記使用自定義 DivIcon 以顯示數字。
         - 資訊卡片包含：中文說明、建議時間、導航連結。
         - CONFIRMATION: NO SVG graphics used. NO Mermaid JS used.
    -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; overflow: hidden; }
        #map { height: 100%; width: 100%; z-index: 10; border-radius: 0 1rem 1rem 0; }
        .marker-icon {
            background-color: #0f172a;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            border: 3px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.3s;
        }
        .marker-active { background-color: #10b981; transform: scale(1.2); }
        .spot-card-active { border-left: 6px solid #10b981; background-color: #f1f5f9; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center shrink-0 z-30 shadow-sm">
        <div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">澳洲東海岸：好友重聚公路旅行</h1>
            <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">3月11日 - 3月20日 | 雪梨 ➔ 布里斯本</p>
        </div>
        <div class="hidden md:flex gap-4">
            <div class="bg-slate-100 px-3 py-1.5 rounded-full text-[10px] font-bold text-slate-600">🚗 總里程 ~2,100km</div>
            <div class="bg-emerald-100 px-3 py-1.5 rounded-full text-[10px] font-bold text-emerald-700">📍 13 個核心景點</div>
        </div>
    </header>

    <div class="flex-grow flex flex-col md:flex-row overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-[400px] bg-white border-r flex flex-col shrink-0 z-20 shadow-xl">
            
            <!-- Context Header -->
            <div id="sidebar-header" class="p-4 bg-slate-50 border-b flex justify-between items-center">
                <h2 id="list-title" class="font-black text-slate-700 text-xs uppercase tracking-widest">景點探索清單</h2>
                <button id="back-btn" onclick="showList()" class="hidden text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded hover:bg-blue-100">⬅ 回到列表</button>
            </div>

            <!-- Scrollable Content -->
            <div id="sidebar-content" class="flex-grow overflow-y-auto">
                <!-- List View or Detail View will be injected here -->
            </div>

            <!-- Footer Meta -->
            <div class="p-4 bg-slate-900 text-white text-[10px] space-y-2">
                <p class="opacity-70 font-bold">⚠️ 駕駛叮嚀：雪梨到科夫港路段長達 530km，請每兩小時休息一次。黃金海岸鵜鶘秀請準時於 1:15 PM 抵達找位。</p>
            </div>
        </aside>

        <!-- Map -->
        <div class="flex-grow relative">
            <div id="map"></div>
            
            <!-- Floating Navigation Helper -->
            <div class="absolute bottom-6 left-6 z-[1000] space-y-2 hidden md:block">
                <div class="bg-white p-3 rounded-2xl shadow-xl border border-slate-100 text-[11px] font-bold text-slate-600">
                    <div class="flex items-center gap-2 mb-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> 點擊數字查看攻略</div>
                    <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-slate-300"></span> 藍色虛線為建議路線</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Full Data Integration
        const spots = [
            { 
                id: 1, 
                name: "雪梨歌劇院 & 市區博物館", 
                lat: -33.8568, lng: 151.2153, 
                date: "3/11-12",
                city: "Sydney",
                bestTime: "全天 / 傍晚點燈",
                desc: "旅程起點。建議參觀 MCA 當代藝術館或新州美術館（皆為免費）。夜晚可沿著 Circular Quay 散步觀賞歌劇院夜景。",
                tips: "市區停車極貴且不便，這兩天建議將車停在 Earlwood 住宿點，搭火車進城。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Sydney+Opera+House"
            },
            { 
                id: 2, 
                name: "屈臣氏灣 Watsons Bay", 
                lat: -33.8441, lng: 151.2825, 
                date: "3/12",
                city: "Sydney East",
                bestTime: "下午 1:00 - 4:00",
                desc: "搭乘渡輪前往，這裡有著名的 Gap Bluff 懸崖與裸體海灘。風景極美，是遠眺雪梨天際線的絕佳視角。",
                tips: "推薦在海邊吃 Doyles 的 Fish & Chips。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Watsons+Bay+Sydney"
            },
            { 
                id: 3, 
                name: "Dudley Page Reserve", 
                lat: -33.8741, lng: 151.2770, 
                date: "3/12",
                city: "Sydney East",
                bestTime: "傍晚 6:00 (看夕陽)",
                desc: "網紅隱藏版景點。這裡是一片大草坪，可以無遮擋地看到歌劇院與雪梨大橋在夕陽下的剪影。",
                tips: "帶上一塊野餐墊，在這裡看夕陽非常 chill。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Dudley+Page+Reserve"
            },
            { 
                id: 4, 
                name: "邦代海灘 Bondi Beach", 
                lat: -33.8915, lng: 151.2767, 
                date: "3/12",
                city: "Sydney East",
                bestTime: "清晨 5:00 晨跑",
                desc: "雪梨最著名的海灘。依照計畫可以在清晨 5 點來這裡晨跑，感受澳洲人的戶外運動文化。",
                tips: "跑完可以去 Bondi Icebergs 拍一張經典的海邊泳池照。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Bondi+Beach"
            },
            { 
                id: 5, 
                name: "皇家國家公園 Figure 8 Pool", 
                lat: -34.1378, lng: 151.0560, 
                date: "3/13",
                city: "South Sydney",
                bestTime: "低潮時段 (須先查潮汐表)",
                desc: "世界著名的天然 8 字型水池。入內需支付 $12 車輛進入費。這是一段具有挑戰性的徒步路徑。",
                tips: "一定要在 Low Tide (低潮) 抵達，否則水池會被淹沒且具危險性。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Figure+8+Pools+Royal+National+Park"
            },
            { 
                id: 6, 
                name: "Minnehaha Falls 瀑布", 
                lat: -33.6934, lng: 150.3150, 
                date: "3/13",
                city: "Blue Mountains",
                desc: "藍山的秘境瀑布。步道清幽，最後可以抵達瀑布底部的潭水，非常適合喜歡避開人群的人。",
                tips: "步道後半段較窄，建議穿抓地力好的登山鞋。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Minnehaha+Falls+Katoomba"
            },
            { 
                id: 8, 
                name: "藍山三姊妹岩夕陽", 
                lat: -33.7321, lng: 150.3121, 
                date: "3/13",
                city: "Blue Mountains",
                bestTime: "傍晚 6:30 (Sunset)",
                desc: "澳洲指標性景觀。落日時分三姊妹岩會被染成金紅色。推薦走一段 Giant Stairway 步道。",
                tips: "Echo Point 景觀台是最佳拍攝位，傍晚風大記得帶外套。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Three+Sisters+Echo+Point"
            },
            { 
                id: 9, 
                name: "Emerald Beach (Kangaroo Point)", 
                lat: -30.1610, lng: 153.1890, 
                date: "3/14-15",
                city: "Coffs Harbour",
                bestTime: "早晨或傍晚",
                desc: "你以前住過的地方。在 Look At Me Now Headland 可以看到成群的野生袋鼠在草地上跳躍。",
                tips: "袋鼠在清晨與傍晚最活躍。請勿餵食野生袋鼠。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Emerald+Beach+Look+At+Me+Now+Headland"
            },
            { 
                id: 10, 
                name: "拜倫灣燈塔 & 州界地標", 
                lat: -28.6431, lng: 153.6350, 
                date: "3/15",
                city: "NSW/QLD Border",
                bestTime: "下午 3:00",
                desc: "澳洲最東點。絕美的白色燈塔配上蔚藍海岸。接著前往 Tweed Heads 拍下腳跨兩州的照片。",
                tips: "燈塔附近停車非常困難，建議停在山下步道口走上去。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Cape+Byron+Lighthouse"
            },
            { 
                id: 11, 
                name: "鵜鶘餵食秀 Pelican Feeding", 
                lat: -27.9150, lng: 153.4110, 
                date: "3/16",
                city: "Gold Coast",
                bestTime: "1:15 PM (餵食 1:30 PM 開始)",
                desc: "黃金海岸經典項目。Charis Seafoods 每天會將剩餘魚骨餵食給野生鵜鶘，場面壯觀。",
                tips: "這是必去行程。看完可以順便在旁邊買鮮甜的海鮮午餐。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Charis+Seafoods+Pelican+Feeding"
            },
            { 
                id: 12, 
                name: "Springbrook 藍光蟲", 
                lat: -28.1925, lng: 153.2730, 
                date: "3/17",
                city: "Gold Coast",
                bestTime: "晚上 8:00 (看藍光蟲)",
                desc: "在 Natural Bridge (自然橋) 的洞穴中，可以觀察到神奇的藍光螢火蟲。是澳洲唯一的特有種。",
                tips: "洞穴內嚴禁閃光燈與手電筒直射，請安靜觀察以免干擾生態。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Natural+Bridge+Springbrook+National+Park"
            },
            { 
                id: 13, 
                name: "Moogerah Dam (看星星)", 
                lat: -28.0300, lng: 152.5400, 
                date: "3/18",
                city: "Brisbane Outskirts",
                bestTime: "深夜 9:00 後",
                desc: "布里斯本周邊最受歡迎的觀星地。湖面平靜如鏡，無光害時可以肉眼看見銀河。",
                tips: "這裡晚上溫差極大，即便是夏天也要帶厚外套。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Lake+Moogerah+Stargazing"
            },
            { 
                id: 14, 
                name: "Noosa Main Beach & Fairy Pools", 
                lat: -26.3800, lng: 153.0900, 
                date: "3/19-20",
                city: "Sunshine Coast",
                desc: "陽光海岸最美的一角。Fairy Pools 是隱藏在礁石間的天然泳池。旅程的完美結尾。",
                tips: "前往 Fairy Pools 需健行一段路，建議穿好走的涼鞋。",
                gMap: "https://www.google.com/maps/search/?api=1&query=Fairy+Pools+Noosa+National+Park"
            }
        ];

        let map, markers = [], polyline;

        function initMap() {
            map = L.map('map', {
                scrollWheelZoom: true,
                zoomControl: false
            }).setView([-30.5, 152.0], 6);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            renderList();
            renderMarkers();
            
            // Auto focus on first spot
            setTimeout(() => focusSpot(0, false), 1000);
        }

        function renderMarkers() {
            const coords = spots.map(s => [s.lat, s.lng]);

            // Path Line
            polyline = L.polyline(coords, {
                color: '#3b82f6',
                weight: 2,
                opacity: 0.4,
                dashArray: '5, 10'
            }).addTo(map);

            // Markers with sequence numbers
            spots.forEach((s, i) => {
                const icon = L.divIcon({
                    className: 'custom-icon',
                    html: `<div class="marker-icon" id="marker-${i}">${i + 1}</div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([s.lat, s.lng], { icon: icon })
                    .on('click', () => focusSpot(i, true))
                    .addTo(map);
                
                markers.push(marker);
            });
        }

        function renderList() {
            const container = document.getElementById('sidebar-content');
            container.innerHTML = spots.map((s, i) => `
                <div onclick="focusSpot(${i}, true)" id="spot-card-${i}" class="p-4 cursor-pointer hover:bg-slate-50 transition-all border-b border-slate-100 flex gap-4 group">
                    <div class="flex flex-col items-center">
                        <div class="w-8 h-8 rounded-full bg-slate-800 text-white text-xs font-black flex items-center justify-center">${i + 1}</div>
                        <div class="w-px h-full bg-slate-200 mt-2"></div>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <h3 class="font-bold text-slate-800 text-sm group-hover:text-emerald-600 transition-colors">${s.name}</h3>
                        </div>
                        <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest">${s.city}</p>
                        <div class="mt-2 flex gap-2">
                            <span class="text-[9px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-bold">${s.date}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.focusSpot = function(index, showDetail) {
            const s = spots[index];
            map.flyTo([s.lat, s.lng], showDetail ? 14 : 7, { duration: 1.5 });

            // Visual feedback on list
            document.querySelectorAll('[id^="spot-card-"]').forEach(el => el.classList.remove('spot-card-active'));
            const card = document.getElementById(`spot-card-${index}`);
            if(card) card.classList.add('spot-card-active');

            // Visual feedback on marker
            document.querySelectorAll('.marker-icon').forEach(el => el.classList.remove('marker-active'));
            const markerDiv = document.getElementById(`marker-${index}`);
            if(markerDiv) markerDiv.classList.add('marker-active');

            if(showDetail) renderDetail(index);
        };

        function renderDetail(index) {
            const s = spots[index];
            const container = document.getElementById('sidebar-content');
            const backBtn = document.getElementById('back-btn');
            const listTitle = document.getElementById('list-title');

            backBtn.classList.remove('hidden');
            listTitle.innerText = `景點攻略 #${index + 1}`;

            container.innerHTML = `
                <div class="p-6 animate-in fade-in slide-in-from-left duration-300">
                    <div class="mb-4">
                        <span class="text-[10px] font-black text-emerald-600 uppercase tracking-widest">${s.city}</span>
                        <h2 class="text-2xl font-black text-slate-800 mt-1">${s.name}</h2>
                    </div>

                    ${s.bestTime ? `
                        <div class="bg-amber-50 p-3 rounded-xl border border-amber-100 mb-6 flex items-start gap-3">
                            <span class="text-lg">🕒</span>
                            <div>
                                <p class="text-[10px] font-bold text-amber-700 uppercase">建議造訪時間</p>
                                <p class="text-sm font-bold text-amber-900">${s.bestTime}</p>
                            </div>
                        </div>
                    ` : ''}

                    <div class="space-y-6">
                        <div>
                            <h4 class="text-xs font-black text-slate-400 uppercase mb-2">景點描述</h4>
                            <p class="text-sm text-slate-600 leading-relaxed font-medium">${s.desc}</p>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                            <h4 class="text-xs font-black text-slate-400 uppercase mb-2">💡 攻略秘笈</h4>
                            <p class="text-xs text-slate-500 leading-relaxed italic">${s.tips}</p>
                        </div>

                        <a href="${s.gMap}" target="_blank" class="block w-full bg-slate-900 text-white text-center py-4 rounded-2xl font-black text-sm hover:bg-slate-800 transition-all flex items-center justify-center gap-2 shadow-lg shadow-slate-200">
                            導航至此景點 (Google Maps) ↗
                        </a>
                    </div>
                </div>
            `;
            container.scrollTop = 0;
        }

        window.showList = function() {
            const backBtn = document.getElementById('back-btn');
            const listTitle = document.getElementById('list-title');
            backBtn.classList.add('hidden');
            listTitle.innerText = "景點探索清單";
            renderList();
            map.flyTo([-30.5, 152.0], 6);
        };

        window.onload = initMap;
    </script>
</body>
</html>
