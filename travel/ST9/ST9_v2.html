<!DOCTYPE html>
<html lang="zh-TW">
  <body class="container">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>胡志明市旅遊</title>

      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

      <script src="day1.js"></script>
      <script src="day2.js"></script>
      <script src="day3.js"></script>
      <script src="day4.js"></script>
      <script src="day5.js"></script>
      <script src="day6.js"></script>

      <script type="module" src="main-ui.js"></script>
      <script type="module" src="itinerary.js"></script>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
      <style>
        body {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: "Noto Sans TC", sans-serif;
          background: #fff;
        }
        .container {
          max-width: 1000px;
          margin-left: auto;
          margin-right: auto;
          width: 100%;
          padding-left: 32px;
          padding-right: 32px;
        }
        @media (max-width: 430px) {
          .container {
            max-width: 100vw;
            padding-left: 8px !important;
            padding-right: 8px !important;
          }
          main {
            padding: 12px !important;
          }
          .day-card {
            border-radius: 16px;
          }
          .chart-container {
            max-width: 100vw !important;
          }
          header h1 {
            font-size: 1.3rem;
          }
          .nav-link {
            font-size: 0.95rem;
            padding-left: 8px;
            padding-right: 8px;
          }
          .nav-dropdown {
            margin-left: 30px !important;
            margin-right: 30px !important;
          }
          /* Hide the border line under navigation on mobile */
          nav {
            border-bottom: none !important;
          }
        }

        /* Loading Spinner Styles */
        .spinner-container {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 200px;
          position: relative;
        }

        .spinner {
          width: 40px;
          height: 40px;
          border: 4px solid #f3f3f3;
          border-top: 4px solid #14b8a6;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }

        /* Fade in animation for content */
        .content-fade-in {
          animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        /* Content container transition */
        #content-container {
          transition: opacity 0.2s ease-in-out;
        }
      </style>
    </head>

    <!-- HEADER & SUBHEADER-->
    <div class="mx-auto py-6">
      <header class="text-center mb-6">
        <h1 class="text-2xl font-bold text-teal-700 leading-tight">
          胡志明市深度自由行
        </h1>
        <p class="text-stone-500 mt-2 text-base">
          為精明旅人打造的7日預算與文化探索全攻略
        </p>
      </header>
    </div>

    <!-- NAVIGATION MENU -->
    <nav class="flex justify-center border-b border-stone-200 mb-6 text-sm">
      <div class="nav-buttons">
        <button
          data-target="dashboard"
          class="nav-link active font-bold py-2 px-4 text-teal-600 border-b-2 border-teal-500"
          style="border-bottom-width: 2px; border-color: #14b8a6"
        >
          總覽
        </button>
        <button
          data-target="local-eye"
          class="nav-link font-bold py-2 px-4 text-stone-600 hover:text-teal-600"
        >
          在地之眼
        </button>
        <button
          data-target="itinerary"
          class="nav-link font-bold py-2 px-4 text-stone-600 hover:text-teal-600"
        >
          每日行程
        </button>
        <button
          data-target="hotspots"
          class="nav-link font-bold py-2 px-4 text-stone-600 hover:text-teal-600"
        >
          熱門活動
        </button>
        <button
          data-target="budget"
          class="nav-link font-bold py-2 px-4 text-stone-600 hover:text-teal-600"
        >
          預算追蹤
        </button>
        <button
          data-target="toolkit"
          class="nav-link font-bold py-2 px-4 text-stone-600 hover:text-teal-600"
        >
          旅人工具包
        </button>
      </div>
      <select
        id="mobile-nav"
        class="nav-dropdown font-bold py-2 px-4 rounded-md border border-teal-300"
        style="display: none; width: 100%; margin-top: 8px"
      >
        <option value="dashboard">總覽</option>
        <option value="local-eye">在地之眼</option>
        <option value="itinerary">每日行程</option>
        <option value="hotspots">熱門活動</option>
        <option value="budget">預算追蹤</option>
        <option value="toolkit">旅人工具包</option>
      </select>
    </nav>
    <!-- MAIN CONTENT -->
    <main class="text-base" style="padding: 24px">
      <!-- Loading Spinner -->
      <div id="loading-spinner" class="spinner-container" style="display: none">
        <div class="spinner"></div>
      </div>

      <!-- Dynamic Content Container -->
      <div id="content-container">
        <section id="dashboard" class="section">
          <!-- Content will be loaded here -->
        </section>

        <section id="local-eye" class="section" style="display: none">
          <!-- Content will be loaded here -->
        </section>

        <section id="itinerary" class="section" style="display: none">
          <!-- Content will be loaded here -->
        </section>

        <section id="hotspots" class="section" style="display: none">
          <!-- Content will be loaded here -->
        </section>

        <section id="budget" class="section" style="display: none">
          <!-- Content will be loaded here -->
        </section>

        <section id="toolkit" class="section" style="display: none">
          <!-- Content will be loaded here -->
        </section>
      </div>
    </main>

    <footer>
      <div class="mx-auto py-4">
        <p class="text-center text-sm text-gray-600">&copy; 2025 by Cynthia.</p>
      </div>
    </footer>
  </body>
</html>
