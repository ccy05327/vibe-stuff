<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>胡志明市旅遊 - 選擇版本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans TC", sans-serif;
        background: linear-gradient(
          135deg,
          #f3f4f6 0%,
          #e5e7eb 50%,
          #d1d5db 100%
        );
      }
      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col justify-center items-center text-gray-800"
  >
    <!-- 返回按鈕 -->
    <a
      href="../../"
      class="fixed top-4 left-4 z-50 bg-teal-100/70 text-teal-700 px-3 py-1.5 rounded-full shadow border border-teal-200 backdrop-blur-sm flex items-center hover:bg-teal-200/90 hover:text-teal-900 transition-all"
      style="font-size: 1rem"
    >
      <span class="mr-2">&#8592;</span> 返回首頁
    </a>

    <main
      class="flex flex-col items-center justify-center w-full min-h-screen px-4"
    >
      <!-- 標題區域 -->
      <div class="text-center mb-12">
        <h1
          class="text-4xl md:text-5xl font-extrabold text-teal-700 mb-4 drop-shadow"
        >
          🇻🇳 胡志明市旅遊助理
        </h1>
        <p class="text-gray-600 text-lg max-w-2xl mx-auto">
          選擇您想要使用的版本，體驗不同風格的旅遊規劃介面
        </p>
      </div>

      <!-- 版本選擇卡片 -->
      <div
        class="flex flex-col lg:flex-row gap-8 w-full max-w-4xl justify-center"
      >
        <!-- 經典版本 -->
        <div
          class="flex-1 bg-white rounded-2xl shadow-lg p-8 flex flex-col items-center border border-gray-100 hover:border-teal-300 transition-all duration-300 card-hover"
        >
          <span class="text-6xl mb-6">📖</span>
          <h2 class="text-2xl font-bold text-teal-700 mb-3">經典版本 (ST9)</h2>
          <p class="text-gray-500 text-base mb-6 text-center leading-relaxed">
            原始的互動式旅遊行程，提供完整的胡志明市7日遊規劃，<br />
            包含預算追蹤、景點介紹與實用資訊。
          </p>
          <div class="flex flex-wrap gap-2 mb-6 justify-center">
            <span
              class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm"
              >互動地圖</span
            >
            <span
              class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm"
              >預算管理</span
            >
            <span
              class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm"
              >行程規劃</span
            >
          </div>
          <a
            href="ST9.html"
            class="mt-auto bg-teal-200 hover:bg-teal-300 text-teal-900 font-semibold px-8 py-3 rounded-full shadow transition-all duration-300 hover:shadow-lg"
          >
            進入經典版
          </a>
        </div>

        <!-- 最終版本 -->
        <div
          class="flex-1 bg-white rounded-2xl shadow-lg p-8 flex flex-col items-center border border-gray-100 hover:border-amber-300 transition-all duration-300 card-hover"
        >
          <span class="text-6xl mb-6">✨</span>
          <h2 class="text-2xl font-bold text-amber-700 mb-3">
            進階版 (ST9 v2)
          </h2>
          <p class="text-gray-500 text-base mb-6 text-center leading-relaxed">
            升級版旅遊助理，採用現代化設計與多分頁結構，<br />
            整合在地視角分析、熱門活動清單與旅人工具包。
          </p>
          <div class="flex flex-wrap gap-2 mb-6 justify-center">
            <span
              class="px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-sm"
              >分頁導航</span
            >
            <span
              class="px-3 py-1 bg-teal-100 text-teal-700 rounded-full text-sm"
              >河粉指數</span
            >
            <span class="px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm"
              >防騙攻略</span
            >
          </div>
          <a
            href="ST9_v2.html"
            class="mt-auto bg-amber-200 hover:bg-amber-300 text-amber-900 font-semibold px-8 py-3 rounded-full shadow transition-all duration-300 hover:shadow-lg"
          >
            進入最終版
          </a>
        </div>
      </div>

      <!-- 頁腳 -->
      <footer class="mt-16 text-center text-gray-500 text-sm">
        <p>經典版生成於2025/06/27，進階版生成於2025/08/10</p>
      </footer>
    </main>
  </body>
</html>
