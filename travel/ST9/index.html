<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>胡志明市旅遊 - 選擇版本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans TC", sans-serif;
        background: linear-gradient(
          135deg,
          #f3f4f6 0%,
          #e5e7eb 50%,
          #d1d5db 100%
        );
      }
      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col justify-center items-center text-gray-800 px-4 py-6 md:px-12 md:py-10"
  >
    <!-- 返回按鈕 -->
    <div class="fixed top-4 left-4 z-50">
      <button
        onclick="window.location.href='../../index.html'"
        class="flex items-center justify-center w-10 h-10 bg-teal-100 text-teal-700 rounded-full shadow hover:bg-teal-200 transition-all duration-200"
      >
        <span class="text-2xl">&#8592;</span>
      </button>
    </div>

    <main
      class="flex flex-col items-center justify-center w-full min-h-screen px-2 py-4 md:py-8"
    >
      <!-- 標題區域 -->
      <div class="text-center mb-6">
        <h1 class="text-2xl font-extrabold text-teal-700 mb-2 drop-shadow mt-2">
          🇻🇳 胡志明市旅遊助理
        </h1>
        <p class="text-gray-600 text-base max-w-xs mx-auto mt-3">
          選擇您想要使用的版本，體驗不同風格的旅遊規劃介面
        </p>
      </div>

      <!-- 版本選擇卡片 -->
      <div class="flex flex-col gap-6 w-full max-w-md mx-auto">
        <!-- 經典版本 -->
        <div
          class="bg-white rounded-2xl shadow-lg p-4 flex flex-col items-center border border-gray-100 hover:border-teal-300 transition-all duration-300 card-hover"
        >
          <span class="text-4xl mb-4">📖</span>
          <h2 class="text-lg font-bold text-teal-700 mb-2">經典版本 (ST9)</h2>
          <p class="text-gray-500 text-sm mb-4 text-center leading-relaxed">
            原始的互動式旅遊行程，提供完整的旅遊規劃，包含預算追蹤、景點介紹與實用資訊。
          </p>
          <div class="flex flex-wrap gap-1 mb-4 justify-center">
            <span
              class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm"
              >互動地圖</span
            >
            <span
              class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm"
              >預算管理</span
            >
            <span
              class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm"
              >行程規劃</span
            >
          </div>
          <a
            href="ST9.html"
            class="mt-2 bg-teal-200 hover:bg-teal-300 text-teal-900 font-semibold px-6 py-2 rounded-full shadow transition-all duration-300 hover:shadow-lg text-sm"
            >進入經典版</a
          >
        </div>

        <!-- 最終版本 -->
        <div
          class="bg-white rounded-2xl shadow-lg p-4 flex flex-col items-center border border-gray-100 hover:border-amber-300 transition-all duration-300 card-hover"
        >
          <span class="text-4xl mb-4">✨</span>
          <h2 class="text-lg font-bold text-amber-700 mb-2">進階版 (ST9 v2)</h2>
          <p class="text-gray-500 text-sm mb-4 text-center leading-relaxed">
            升級版旅遊助理，採用現代化設計與多分頁結構，整合在地視角分析、熱門活動清單與旅人工具包。
          </p>
          <div class="flex flex-wrap gap-1 mb-4 justify-center">
            <span
              class="px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-sm"
              >分頁導航</span
            >
            <span
              class="px-3 py-1 bg-teal-100 text-teal-700 rounded-full text-sm"
              >河粉指數</span
            >
            <span class="px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm"
              >防騙攻略</span
            >
          </div>
          <a
            href="ST9_v2.html"
            class="mt-2 bg-amber-200 hover:bg-amber-300 text-amber-900 font-semibold px-6 py-2 rounded-full shadow transition-all duration-300 hover:shadow-lg text-sm"
            >進入最終版</a
          >
        </div>
      </div>

      <!-- 頁腳 -->
      <footer class="mt-12 text-center text-gray-500 text-xs px-2">
        <p>經典版生成於2025/06/27，進階版生成於2025/08/10</p>
      </footer>
    </main>
  </body>
</html>
